name: Code Quality & Linting

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'

jobs:
  python-lint:
    runs-on: ubuntu-latest
    name: Python Linting & Auto-Fix
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Auto-fix formatting and imports
        run: |
          black . --exclude "/(venv|\.venv|migrations|node_modules)/"
          isort . --skip venv --skip .venv --skip migrations --profile black

      - name: Commit and Push auto-fixed changes
        id: auto_commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "style: auto-fixed code formatting and import sorting"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "fixed=true" >> $GITHUB_OUTPUT
          else
            echo "fixed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Flake8 linting
        run: |
          flake8 . \
            --exclude=venv/,migrations/,.venv/,node_modules/ \
            --ignore=E501,W503 \
            --max-line-length=100 \
            --count \
            --statistics

  javascript-lint:
    runs-on: ubuntu-latest
    name: JavaScript Linting
    needs: python-lint
    if: always() && (needs.python-lint.result == 'success' || needs.python-lint.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier format check
        run: |
          if npm list prettier --depth=0 2>/dev/null | grep -q prettier; then
            npm run format:check
          fi

      - name: Run ESLint
        run: |
          if npm list eslint --depth=0 2>/dev/null | grep -q eslint; then
            npm run lint
          fi

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Security Check
    needs: python-lint
    if: always() && (needs.python-lint.result == 'success' || needs.python-lint.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --desc

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

  django-checks:
    runs-on: ubuntu-latest
    name: Django System Checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinhanh_check
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DEBUG: 'False'
      SECRET_KEY: 'check-key-not-for-production'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      
      DATABASE_NAME: dinhanh_check
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for pending (uncommitted) migrations
        run: python manage.py makemigrations --check --dry-run

  quality-check-summary:
    runs-on: ubuntu-latest
    name: Quality Checks Summary
    needs: [python-lint, javascript-lint, dependency-check, django-checks]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Linting     | ${{ needs.python-lint.result }}      |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript Linting | ${{ needs.javascript-lint.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit   | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Django Checks      | ${{ needs.django-checks.result }}    |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any check failed
        run: |
          FAILED=0
          [ "${{ needs.python-lint.result }}"      == "failure" ] && { echo "Python linting failed";      FAILED=1; }
          [ "${{ needs.javascript-lint.result }}"  == "failure" ] && { echo "JavaScript linting failed";  FAILED=1; }
          [ "${{ needs.dependency-check.result }}" == "failure" ] && { echo "Dependency audit failed";    FAILED=1; }
          [ "${{ needs.django-checks.result }}"    == "failure" ] && { echo "Django system checks failed"; FAILED=1; }
          [ $FAILED -eq 1 ] && exit 1
          echo "All code quality checks passed!"