name: Code Quality & Linting

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # 1. Python Linting
  # ─────────────────────────────────────────────
  python-lint:
    runs-on: ubuntu-latest
    name: Python Linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install black flake8 isort

      - name: Check code formatting with Black
        # Fails the job if any file is not formatted correctly
        run: black --check --diff . --exclude "/(venv|\.venv|migrations|node_modules)/"

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff . \
            --skip venv \
            --skip .venv \
            --skip migrations \
            --profile black

      - name: Run Flake8 linting
        run: |
          flake8 . \
            --exclude=venv/,migrations/,.venv/,node_modules/ \
            --ignore=E501,W503 \
            --max-line-length=100 \
            --count \
            --statistics

  # ─────────────────────────────────────────────
  # 2. JavaScript / Node.js Linting
  # ─────────────────────────────────────────────
  javascript-lint:
    runs-on: ubuntu-latest
    name: JavaScript Linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run Prettier format check
        run: |
          if npm list prettier --depth=0 2>/dev/null | grep -q prettier; then
            npm run format:check
          else
            echo "Prettier not found in package.json — skipping format check"
          fi

      - name: Run ESLint
        run: |
          if npm list eslint --depth=0 2>/dev/null | grep -q eslint; then
            npm run lint
          else
            echo "ESLint not found in package.json — skipping lint check"
          fi

  # ─────────────────────────────────────────────
  # 3. Dependency Security Check
  # ─────────────────────────────────────────────
  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Security Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pip-audit
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        # Fail on HIGH or CRITICAL vulnerabilities
        run: pip-audit -r requirements.txt --desc

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --frozen-lockfile

      - name: Audit npm dependencies
        # Fail on moderate or above
        run: npm audit --audit-level=moderate

  # ─────────────────────────────────────────────
  # 4. Django System Checks & Migration Integrity
  # ─────────────────────────────────────────────
  django-checks:
    runs-on: ubuntu-latest
    name: Django System Checks

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinhanh_check
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DEBUG: 'False'
      SECRET_KEY: 'check-key-not-for-production'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: dinhanh_check
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for pending (uncommitted) migrations
        # Ensures all model changes have corresponding migration files
        run: python manage.py makemigrations --check --dry-run

  # ─────────────────────────────────────────────
  # 5. Summary Gate
  # ─────────────────────────────────────────────
  quality-check-summary:
    runs-on: ubuntu-latest
    name: Quality Checks Summary
    needs: [python-lint, javascript-lint, dependency-check, django-checks]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Linting     | ${{ needs.python-lint.result }}      |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript Linting | ${{ needs.javascript-lint.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit   | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Django Checks      | ${{ needs.django-checks.result }}    |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any check failed
        run: |
          FAILED=0
          [ "${{ needs.python-lint.result }}"      == "failure" ] && { echo "Python linting failed";      FAILED=1; }
          [ "${{ needs.javascript-lint.result }}"  == "failure" ] && { echo "JavaScript linting failed";  FAILED=1; }
          [ "${{ needs.dependency-check.result }}" == "failure" ] && { echo "Dependency audit failed";    FAILED=1; }
          [ "${{ needs.django-checks.result }}"    == "failure" ] && { echo "Django system checks failed"; FAILED=1; }
          [ $FAILED -eq 1 ] && exit 1
          echo "All code quality checks passed!"