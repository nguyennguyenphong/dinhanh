name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: dinhanh
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Run Django tests
  test-django:
    runs-on: ubuntu-latest
    name: Django Tests
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinhanh_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Django checks
        run: |
          python manage.py check
        env:
          DEBUG: 'False'
          SECRET_KEY: 'test-secret-key-do-not-use-in-production'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: dinhanh_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: '5432'
          REDIS_URL: redis://localhost:6379/0

      - name: Run Django migrations
        run: |
          python manage.py migrate
        env:
          DEBUG: 'False'
          SECRET_KEY: 'test-secret-key-do-not-use-in-production'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: dinhanh_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: '5432'
          REDIS_URL: redis://localhost:6379/0

      - name: Run Django tests
        run: |
          python manage.py test --verbosity=2 --parallel
        env:
          DEBUG: 'False'
          SECRET_KEY: 'test-secret-key-do-not-use-in-production'
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: dinhanh_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: '5432'
          REDIS_URL: redis://localhost:6379/0

  # Build and validate frontend
  build-frontend:
    runs-on: ubuntu-latest
    name: Frontend Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Build frontend
        run: npm run build

      - name: Verify dist folder
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not found after build"
            exit 1
          fi
          echo "Frontend build successful. Generated files:"
          ls -lh dist/

  # Build Docker image and push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    needs: [test-django, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v3
        if: always()
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: 'Dinhanh - Django + Node.js Web Application'
          readme-filepath: ./README.md

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Notification on completion
  notify:
    runs-on: ubuntu-latest
    name: Workflow Status
    needs: [test-django, build-frontend, build-and-push, security-scan]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.test-django.result }}" == "failure" ]; then
            echo "❌ Django tests failed"
            exit 1
          fi
          if [ "${{ needs.build-frontend.result }}" == "failure" ]; then
            echo "❌ Frontend build failed"
            exit 1
          fi
          if [ "${{ needs.build-and-push.result }}" == "failure" ] && [ "${{ github.event_name }}" == "push" ]; then
            echo "❌ Docker image build/push failed"
            exit 1
          fi
          echo "✅ All checks passed successfully!"
