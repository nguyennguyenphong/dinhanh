name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: dinhanh
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  test-django:
    runs-on: ubuntu-latest
    name: Django Tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinhanh_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
        options: >-
          --health-cmd pg_isready
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DEBUG: 'False'
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      DB_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: dinhanh_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: core.settings.local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-django pytest-cov coverage

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}

      - name: Run Django system checks
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true

      - name: Run database migrations
        run: python manage.py migrate --no-input

      # - name: Run tests with coverage
      #   env:
      #     PYTHONPATH: .
      #   run: |
      #     pytest \
      #       --cov=. \
      #       --cov-report=xml \
      #       --cov-report=term-missing \
      #       --cov-fail-under=70 \
      #       -v \
      #       --tb=short

      # - name: Upload coverage report
      #   uses: codecov/codecov-action@v4
      #   if: always()
      #   with:
      #     files: ./coverage.xml
      #     fail_ci_if_error: false
      #     token: ${{ secrets.CODECOV_TOKEN }}

  build-frontend:
    runs-on: ubuntu-latest
    name: Frontend Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify static/build folder
        run: |
          if [ ! -d "static/build" ]; then
            echo "Error: static/build folder not found after build"
            exit 1
          fi

      - name: Upload static/build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: static/build/
          retention-days: 1

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    needs: [test-django, build-frontend, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend static/build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: 'Dinhanh — Django + Node.js Web Application'
          readme-filepath: ./README.md

  notify:
    runs-on: ubuntu-latest
    name: Workflow Status
    needs: [test-django, build-frontend, security-scan, build-and-push]
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Django Tests     | ${{ needs.test-django.result }}     |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build   | ${{ needs.build-frontend.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan    | ${{ needs.security-scan.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Push      | ${{ needs.build-and-push.result }}  |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        run: |
          FAILED=0
          [ "${{ needs.test-django.result }}"    == "failure" ] && { echo "Django tests failed";    FAILED=1; }
          [ "${{ needs.build-frontend.result }}" == "failure" ] && { echo "Frontend build failed";  FAILED=1; }
          [ "${{ needs.security-scan.result }}"  == "failure" ] && { echo "Security scan failed";   FAILED=1; }
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            [ "${{ needs.build-and-push.result }}" == "failure" ] && { echo "Docker push failed"; FAILED=1; }
          fi
          [ $FAILED -eq 1 ] && exit 1
          echo "All critical checks passed!"