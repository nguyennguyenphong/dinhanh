<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-gray-200 pb-5 dark:border-slate-800">
    <div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">
            {% block title %}{{ title }}{% endblock %}
        </h1>
        
        {% block description %}
            {% if description %}
                <p class="text-sm text-gray-500 dark:text-slate-400">{{ description }}</p>
            {% endif %}
        {% endblock %}
    </div>

    <div>
        {% block actions %}
        
        {% endblock %}
    </div>
</div>
