{% load static %}

<!DOCTYPE html>
<html lang="vi" class="min-h-screen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <script src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.6.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline@2.1.0/dist/preline.min.js"></script>
    <script>
        window.FloatingUIDOM = window.FloatingUIDOM || {};
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-slate-900">

    {% block content %}
    {% endblock %}

    <script>
        const observer = new MutationObserver(() => {
            window.HSStaticMethods?.autoInit();
        });
        observer.observe(document.body, { childList: true, subtree: true });
    </script>

</body>
</html>
