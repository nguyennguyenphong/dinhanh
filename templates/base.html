{% load static %}

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/preline@4.2.0/css/themes/theme.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/preline@4.2.0/dist/preline.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/preline@4.2.0/+esm"></script>
</head>
<body class="h-full bg-gray-50 dark:bg-slate-900">

    {% block content %}
    {% endblock %}

    <script>
        window.HSStaticMethods?.autoInit();
    </script>

</body>
</html>
