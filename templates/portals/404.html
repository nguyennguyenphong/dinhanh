{% extends 'base.html' %}
{% load static %}

{% block title %} 404 - Không tìm thấy trang {% endblock %}

{% block content %}
<section class="bg-white dark:bg-gray-900 min-h-[80vh] flex flex-col justify-center py-8 mx-auto w-full">
    
    <div class="w-full overflow-hidden relative mb-8 bg-gray-50 dark:bg-gray-850 py-4 border-y border-gray-100 dark:border-gray-800">
        <div x-data x-init="$nextTick(() => { if(window.init404Error) window.init404Error(); })" class="w-full">
            <svg id="road-svg" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice"
                xmlns="http://www.w3.org/2000/svg" class="w-full h-40 md:h-52">
                <rect x="0" y="155" width="1200" height="30" fill="#444441" rx="0" />
                <line id="dash1" x1="0" y1="170" x2="80" y2="170" stroke="#FAC775" stroke-width="2.5"
                    stroke-dasharray="40 30" />
                <line id="dash2" x1="0" y1="170" x2="1200" y2="170" stroke="#FAC775" stroke-width="2.5"
                    stroke-dasharray="40 30" />

                <g id="bus">
                    <rect x="0" y="70" width="160" height="80" rx="10" fill="#1A56DB" />
                    <rect x="0" y="70" width="160" height="26" rx="8" fill="#1E429F" />
                    <rect x="0" y="84" width="160" height="12" fill="#1E429F" />
                    <rect x="8" y="78" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.9" />
                    <rect x="44" y="78" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.9" />
                    <rect x="80" y="78" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.9" />
                    <rect x="116" y="78" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.9" />
                    <rect x="8" y="100" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.55" />
                    <rect x="44" y="100" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.55" />
                    <rect x="80" y="100" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.55" />
                    <rect x="116" y="100" width="30" height="16" rx="2.5" fill="#B5D4F4" opacity="0.55" />
                    <rect x="8" y="120" width="30" height="14" rx="2.5" fill="#B5D4F4" opacity="0.35" />
                    <rect x="44" y="120" width="30" height="14" rx="2.5" fill="#B5D4F4" opacity="0.35" />
                    <rect x="80" y="120" width="30" height="14" rx="2.5" fill="#B5D4F4" opacity="0.35" />
                    <rect x="116" y="120" width="30" height="14" rx="2.5" fill="#B5D4F4" opacity="0.35" />
                    <rect x="-12" y="98" width="14" height="42" rx="5" fill="#1E429F" />
                    <rect x="152" y="98" width="14" height="42" rx="5" fill="#1E429F" />
                    <rect x="148" y="88" width="16" height="8" rx="2" fill="#FAC775" opacity="0.9" />
                    <circle id="wheel1" cx="30" cy="153" r="13" fill="#2C2C2A" />
                    <circle cx="30" cy="153" r="7" fill="#888780" />
                    <circle cx="30" cy="153" r="2" fill="#444441" />
                    <circle id="wheel2" cx="128" cy="153" r="13" fill="#2C2C2A" />
                    <circle cx="128" cy="153" r="7" fill="#888780" />
                    <circle cx="128" cy="153" r="2" fill="#444441" />
                    <line id="spoke1a" x1="30" y1="140" x2="30" y2="166" stroke="#444441" stroke-width="1.5" />
                    <line id="spoke1b" x1="17" y1="153" x2="43" y2="153" stroke="#444441" stroke-width="1.5" />
                    <line id="spoke2a" x1="128" y1="140" x2="128" y2="166" stroke="#444441" stroke-width="1.5" />
                    <line id="spoke2b" x1="115" y1="153" x2="141" y2="153" stroke="#444441" stroke-width="1.5" />
                </g>
                <g id="question" opacity="0">
                    <text id="question-text" x="580" y="50" font-family="sans-serif" font-size="35" fill="#EF4444"
                        font-weight="bold">?</text>
                </g>
            </svg>
        </div>
    </div>

    <div class="mx-auto w-full max-w-xl text-center px-4">
        <div class="inline-flex items-center justify-center px-4 py-1.5 mb-4 text-xs font-semibold text-blue-800 bg-blue-100 rounded-full dark:bg-blue-900/30 dark:text-blue-300 uppercase tracking-wider">
            Lỗi Hệ Thống
        </div>
        
        <h1 class="mb-4 text-6xl md:text-7xl font-black tracking-tight bg-linear-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent dark:from-blue-500 dark:to-indigo-400">
            404
        </h1>
        
        <h2 class="mb-3 text-xl font-bold text-gray-900 md:text-2xl dark:text-white uppercase tracking-wide">
            Không tìm thấy trang
        </h2>
        
        <p class="mb-8 text-base font-normal text-gray-500 dark:text-gray-400 max-w-md mx-auto leading-relaxed">
            Trang bạn tìm kiếm đã bị xóa, hoặc chưa bao giờ tồn tại.<br>Hãy quay về bến xuất phát nhé!
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center items-center">
            <button type="button" onclick="window.location.href=`{% url 'dashboard' %}`"
                class="inline-flex items-center justify-center gap-x-2 py-2.5 px-5 w-full sm:w-auto border border-gray-300 dark:border-gray-700 rounded-md text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all duration-200 focus:outline-none active:scale-[0.98]">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                Quay về trang chủ
            </button>

            <button type="button" onclick="history.back()"
                class="inline-flex items-center justify-center gap-x-2 py-2.5 px-5 w-full sm:w-auto border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/20 hover:shadow-blue-500/30 transition-all duration-200 focus:outline-none active:scale-[0.98]">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Trở về trang trước đó
            </button>
        </div>
    </div>
</section>
{% endblock %}
