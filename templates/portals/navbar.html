{% load static %}
<header
    class="sticky top-0 inset-x-0 flex flex-wrap sm:justify-start sm:flex-nowrap z-48 w-full bg-white/80 backdrop-blur-md border-b border-gray-200 text-sm py-2.5 sm:py-4 lg:ps-68 dark:bg-slate-900/80 dark:border-slate-800">
    <nav class="flex items-center justify-between w-full mx-auto px-4 sm:px-6" aria-label="Global">

        <div class="me-5 lg:me-0 lg:hidden">
            <button type="button"
                class="p-2 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 dark:bg-slate-900 dark:border-slate-700 dark:text-white"
                data-hs-overlay="#application-sidebar" aria-controls="application-sidebar"
                aria-label="Toggle navigation">
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" x2="21" y1="6" y2="6" />
                    <line x1="3" x2="21" y1="12" y2="12" />
                    <line x1="3" x2="21" y1="18" y2="18" />
                </svg>
            </button>
        </div>

        <div class="hidden sm:block sm:w-72 md:w-96">
            <label for="search" class="sr-only">Tìm kiếm chuyến xe...</label>
            <div class="relative group">
                <div
                    class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none text-gray-400 group-focus-within:text-blue-500 transition-colors">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </div>
                <input type="search" id="search" name="search"
                    class="py-2 px-4 ps-11 w-full border-[1.5px] border-gray-200 rounded-xl text-sm bg-gray-50/50 hover:border-blue-500 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200"
                    placeholder="Tìm nhanh mã vé, xe, khách hàng...">
            </div>
        </div>

        <div class="flex flex-row items-center justify-end gap-2 sm:gap-4 w-full sm:w-auto">

            <div
                class="hidden md:inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-teal-50 text-teal-800 dark:bg-teal-950/30 dark:text-teal-500">
                <span class="size-1.5 inline-block rounded-full bg-teal-500 animate-pulse"></span>
                Hệ thống trực tuyến
            </div>

            <div class="hs-dropdown relative inline-flex">
                <button id="hs-dropdown-quick-create" type="button"
                    class="size-9.5 p-4 sm:w-auto sm:px-3 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
                    <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    <span class="hidden sm:block">Tạo nhanh</span>
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration-300 hs-dropdown-open:opacity-100 opacity-0 hidden min-w-48 bg-white shadow-xl rounded-xl p-2 mt-2 dark:bg-slate-800 dark:border-slate-700 border border-gray-100"
                    aria-labelledby="hs-dropdown-quick-create">
                    <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-300"
                        href="#">
                        Đặt vé mới
                    </a>
                    <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-300"
                        href="#">
                        Nhận gửi hàng hóa
                    </a>
                    <hr class="my-1 border-gray-100 dark:border-slate-700">
                    <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-300"
                        href="#">
                        Thêm khách hàng mới
                    </a>
                </div>
            </div>

            <div class="hs-dropdown relative inline-flex">
                <button id="hs-dropdown-notifications" type="button"
                    class="size-9.5 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-xl border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none dark:bg-slate-900 dark:border-slate-700 dark:text-white group">
                    <svg class="size-4.5 transition-transform group-hover:rotate-12" xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                    <span class="absolute top-1.5 inset-e-2 flex size-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full size-2 bg-red-500"></span>
                    </span>
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration-300 hs-dropdown-open:opacity-100 opacity-0 hidden min-w-80 bg-white shadow-xl rounded-xl p-2 mt-2 dark:bg-slate-800 dark:border-slate-700 border border-gray-100"
                    aria-labelledby="hs-dropdown-notifications">
                    <div
                        class="px-4 py-2 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center">
                        <span class="font-semibold text-gray-800 dark:text-slate-200">Thông báo mới</span>
                        <a class="text-xs text-blue-600 hover:underline" href="#">Xem hết</a>
                    </div>
                    <div class="py-2 px-1 max-h-60 overflow-y-auto">
                        <a class="flex gap-x-3 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700/50" href="#">
                            <div class="size-2 bg-blue-600 rounded-full mt-2"></div>
                            <div>
                                <p class="text-sm text-gray-800 font-medium dark:text-slate-300">Chuyến xe DA-1024 vừa
                                    xuất bến thành công.</p>
                                <span class="text-xs text-gray-400">2 phút trước</span>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <div class="hs-dropdown relative inline-flex">
                <button id="hs-dropdown-account" type="button"
                    class="inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl text-gray-800 focus:outline-none"
                    aria-haspopup="menu" aria-expanded="false" aria-label="Dropdown">
                    <img class="inline-block size-9.5 rounded-xl ring-2 ring-transparent hover:ring-blue-500/50 transition-all object-cover shadow-inner"
                        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                        alt="Avatar">
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration-300 hs-dropdown-open:opacity-100 opacity-0 hidden min-w-60 bg-white shadow-xl rounded-xl p-2 mt-2 border border-gray-100 dark:bg-slate-800 dark:border-slate-700"
                    role="menu" aria-orientation="vertical" aria-labelledby="hs-dropdown-account">
                    <div class="py-3 px-5 -m-2 bg-gray-50 rounded-t-xl dark:bg-slate-700/50">
                        <p class="text-sm text-gray-500 dark:text-slate-400">Tài khoản điều hành</p>
                        <p class="text-sm font-semibold text-gray-800 dark:text-slate-200">Định Anh Admin</p>
                    </div>
                    <div class="mt-2 py-1.5 space-y-0.5">
                        <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-300"
                            href="#">
                            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                            Hồ sơ cá nhân
                        </a>
                        <hr class="border-gray-100 dark:border-slate-700">
                        <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30"
                            href="#">
                            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" x2="9" y1="12" y2="12" />
                            </svg>
                            Đăng xuất hệ thống
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>
