[flake8]
max-line-length = 120
extend-ignore = E203
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    migrations,
    venv

per-file-ignores =
    *__init__.py: F401, F403, E501
    *views*.py: F401, E501
    *dtos*.py: F401
    *entities*.py: F401
    policies.py: F401
    *forms*.py: F841, E501
    core/settings/*.py: F403, F405, F401, E402
    *models*.py: E501
    *middleware*.py: E501
    *webhook_deliveries.py: E501