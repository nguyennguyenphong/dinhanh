<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-15">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Thông tin cơ bản
    </h3>

    <div class="space-y-1">
        <label for="{{ form.menu_item.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.menu_item.label }} <span class="text-red-500">*</span>
        </label>
        <div>
            {{ form.menu_item }}
        </div>
        {% if form.menu_item.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.menu_item.errors.0 }}</p>
        {% endif %}
    </div>

    <div class="space-y-1">
        <label for="{{ form.role.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.role.label }} <span class="text-red-500">*</span>
        </label>
        <div>
            {{ form.role }}
        </div>
        {% if form.role.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.role.errors.0 }}</p>
        {% endif %}
    </div>
</div>
