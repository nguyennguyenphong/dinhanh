<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-4">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Phân quyền & Bối cảnh
    </h3>

    <div class="space-y-1">
        <label for="{{ form.tenant.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.tenant.label }} <span class="text-red-500">*</span>
        </label>
        <div>
            {{ form.tenant }}
        </div>
        {% if form.tenant.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.tenant.errors.0 }}</p>
        {% endif %}
    </div>

    <div class="space-y-1">
        <label for="{{ form.permission_code.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.permission_code.label }} 
        </label>
        <div>
            {{ form.permission_code }}
        </div>
        {% if form.permission_code.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.permission_code.errors.0 }}</p>
        {% endif %}
    </div>
</div>
