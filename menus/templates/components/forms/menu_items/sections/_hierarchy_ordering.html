<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-4">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Cấu trúc & Sắp xếp
    </h3>

    <div class="space-y-1">
        <label for="{{ form.group.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.group.label }} 
        </label>
        <div>
            {{ form.group }}
        </div>
        {% if form.group.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.group.errors.0 }}</p>
        {% endif %}
    </div>

    <div class="space-y-1">
        <label for="{{ form.parent.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.parent.label }} 
        </label>
        <div>
            {{ form.parent }}
        </div>
        {% if form.parent.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.parent.errors.0 }}</p>
        {% endif %}
    </div>

    <div class="space-y-1">
        <label for="{{ form.sort_order.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ form.sort_order.label }} </label>
        {{ form.sort_order }}
        {% if form.sort_order.errors %}<p class="text-red-500 text-xs mt-1">{{ form.sort_order.errors.0 }}</p>{% endif %}
    </div>
</div>
