<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-15">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Thông tin cơ bản
    </h3>

    {% for field in form %}
    <div class="flex flex-col space-y-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">
            {{ field.label }}
            {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
        </label>
        <div>
            {{ field }}
        </div>
        {% if field.help_text %}
        <p class="text-xs text-gray-400 dark:text-gray-500">{{ field.help_text }}</p>
        {% endif %}
        {% if field.errors %}
        <p class="text-xs text-red-500">{{ field.errors.0 }}</p>
        {% endif %}
    </div>
    {% endfor %}
</div>
