{% if form.non_field_errors %}
    <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
        {{ form.non_field_errors }}
    </div>
{% endif %}

<form action="{% if object %}{% url 'asset_category_update' object.uuid %}{% else %}{% url 'asset_category_create' %}{% endif %}" method="POST" class="space-y-6" autocomplete="off">
    {% csrf_token %}

    <div class="bg-white border border-gray-200 rounded-md p-6 shadow-xs dark:bg-slate-900 dark:border-slate-800 space-y-6">
        <h3 class="text-lg font-bold text-gray-800 dark:text-slate-200 pb-3 border-b border-gray-200 dark:border-slate-800">Thông tin danh mục</h3>
        
        <div class="grid grid-cols-1 gap-6">
            {% for field in form %}
                <div class="flex flex-col space-y-2">
                    <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">
                        {{ field.label }}
                        {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
                    </label>
                    <div>
                        {{ field }}
                    </div>
                    {% if field.help_text %}
                        <p class="text-xs text-gray-400 dark:text-gray-500">{{ field.help_text }}</p>
                    {% endif %}
                    {% if field.errors %}
                        <p class="text-xs text-red-500">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <div class="pt-6 border-t border-gray-200 dark:border-slate-800 flex justify-end gap-3">
            <a href="{% url 'asset_category_list' %}" class="py-2.5 px-5 text-sm font-semibold rounded-md border border-gray-200 bg-white text-gray-750 hover:bg-gray-50 transition-colors">
                Hủy bỏ
            </a>
            <button type="submit" class="py-2.5 px-5 text-sm font-semibold rounded-md bg-blue-600 text-white hover:bg-blue-700 transition-colors shadow-md shadow-blue-500/10">
                Lưu lại
            </button>
        </div>
    </div>
</form>
