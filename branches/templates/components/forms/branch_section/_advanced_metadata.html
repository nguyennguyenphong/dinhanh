<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-15">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Cấu hình nâng cao
    </h3>

    <div class="space-y-1">
        <label for="{{ form.metadata.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ form.metadata.label }} </label>
        {{ form.metadata }} 
        {% if form.metadata.errors %}<p class="text-red-500 text-xs mt-1">{{ form.metadata.errors.0 }}</p>{% endif %}
    </div>
</div>
