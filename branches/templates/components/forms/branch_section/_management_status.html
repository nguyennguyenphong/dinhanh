<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-4">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Quản trị & Vận hành
    </h3>

    <div class="space-y-1">
        <label for="{{ form.manager.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.manager.label }} <span class="text-red-500">*</span>
        </label>
        <div>
            {{ form.manager }}
        </div>
        {% if form.manager.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.manager.errors.0 }}</p>
        {% endif %}
    </div>

    <div class="space-y-1">
        <span class="block text-sm font-medium text-gray-700 dark:text-slate-300">
            {{ form.is_active.label }} <span class="text-red-500">*</span>
        </span>
        <div class="flex gap-4 mt-2">
            {% for radio in form.is_active %}
                <label for="{{ radio.id_for_label }}" class="flex items-center gap-2 p-3 w-full border border-gray-200 rounded-md cursor-pointer hover:bg-gray-100 transition-colors dark:bg-slate-800 dark:border-slate-700">
                    {{ radio.tag }}
                    <span class="text-sm font-medium text-gray-700 dark:text-slate-200">{{ radio.choice_label }}</span>
                </label>
            {% endfor %}
        </div>
        {% if form.is_active.errors %}
            <p class="text-red-500 text-xs mt-1">{{ form.is_active.errors.0 }}</p>
        {% endif %}
    </div>
</div>
