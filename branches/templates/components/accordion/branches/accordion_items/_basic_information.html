<h2 id="accordion-open-heading-1">
    <button type="button"
        class="flex items-center justify-between w-full p-5 font-medium rtl:text-right text-body rounded-t-base border border-t-0 border-x-0 border-b-default hover:text-heading hover:bg-neutral-secondary-medium gap-3"
        data-accordion-target="#accordion-open-body-1" aria-expanded="true" aria-controls="accordion-open-body-1">
        <span class="flex items-center">Thông tin cơ bản</span>
        <svg data-accordion-icon class="w-5 h-5 rotate-180 shrink-0" aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m5 15 7-7 7 7" />
        </svg>
    </button>
</h2>
<div id="accordion-open-body-1" class="hidden border border-s-0 border-e-0 border-t-0 border-b-default bg-white"
    aria-labelledby="accordion-open-heading-1">
    <div class="p-4 md:p-5">
        <div class="flex items-center py-2.5 text-sm">
            <span class="w-36 text-gray-500 shrink-0">Mã chi nhánh</span>
            <code class="text-xs bg-gray-100 dark:bg-slate-700 text-gray-800 dark:text-gray-200 px-2 py-0.5 rounded">{{ branch.code }}</code>
        </div>
        <div class="flex items-center py-2.5 text-sm">
            <span class="w-36 text-gray-500 shrink-0">Tên chi nhánh</span>
            <span class="font-medium text-gray-900 dark:text-white">{{ branch.name }}</span>
        </div>
        <div class="flex items-center py-2.5 text-sm">
            <span class="w-36 text-gray-500 shrink-0">Trạng thái</span>
            {% if branch.is_active %}
                <span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-xs font-medium bg-green-100 text-green-800 dark:bg-green-950 dark:text-green-300">
                    Đang hoạt động
                </span>
            {% else %}
                <span class="inline-flex items-center gap-1.5 py-1 px-2.5 rounded-full text-xs font-medium bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300">
                    Ngừng hoạt động
                </span>
            {% endif %}
        </div>
    </div>
</div>
