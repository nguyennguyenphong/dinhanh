# Celery Beat Scheduler Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: dinhanh
  labels:
    app: celery-beat
    tier: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
      tier: scheduler
  template:
    metadata:
      labels:
        app: celery-beat
        tier: scheduler
    spec:
      containers:
      - name: celery-beat
        image: your-registry/dinhanh:latest
        imagePullPolicy: Always
        command:
        - celery
        - -A
        - core
        - beat
        - -l
        - info
        - --scheduler
        - django_celery_beat.schedulers:DatabaseScheduler
        envFrom:
        - configMapRef:
            name: dinhanh-config
        - secretRef:
            name: dinhanh-secret
        env:
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: dinhanh-config
              key: CELERY_BROKER_URL
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - core
            - inspect
            - active
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
