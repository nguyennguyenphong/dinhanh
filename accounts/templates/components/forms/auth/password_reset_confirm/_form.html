{% load static %}

<form method="POST" action="{% url 'password_reset_confirm' %}?email={{ email }}" class="space-y-4"
      x-data="{
        password: '',
        confirmPassword: '',
        showPassword: false,
        get metrics() {
            let score = 0;
            if (this.password.length >= 8) score++;
            if (/[A-Z]/.test(this.password)) score++;
            if (/[0-9]/.test(this.password)) score++;
            return {
                length: this.password.length >= 8,
                upper: /[A-Z]/.test(this.password),
                number: /[0-9]/.test(this.password),
                score: score
            };
        }
      }">
    {% csrf_token %}

    {% include 'components/forms/auth/password_reset_confirm/sections/_auth_credentials.html' %}

    {% include 'components/forms/auth/password_reset_confirm/sections/_password_setup.html' %}

    <button type="submit" :disabled="metrics.score < 3 || password !== confirmPassword"
        class="w-full inline-flex items-center justify-center gap-x-2 font-semibold rounded-md transition-all duration-200 focus:outline-none active:scale-[0.98] py-2.5 px-4 text-sm bg-blue-600 text-white hover:bg-blue-700 shadow-md shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
        Xác nhận đặt lại mật khẩu
    </button>
</form>
