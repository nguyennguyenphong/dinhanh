<div class="flex-1 flex flex-col items-center justify-center p-6 sm:p-10 overflow-y-auto">
    <!-- Mobile Logo -->
    <div class="lg:hidden mb-8 text-center">
        <div class="inline-flex items-center gap-x-2">
            <div class="size-9 bg-blue-600 rounded-xl flex items-center justify-center">
                <svg class="size-4 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 6v6m0 0v6m0-6h8m0-6v6m0 0v6" />
                </svg>
            </div>
            <span class="text-lg font-bold text-gray-800 dark:text-white">Định Anh CMS</span>
        </div>
    </div>

    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Tạo tài khoản mới</h2>
            <p class="mt-1.5 text-sm text-gray-500 dark:text-slate-400">Điền đầy đủ thông tin để được cấp quyền
                truy cập.</p>
        </div>

        <!-- Errors -->
        {% if form.errors %}
        <div
            class="mb-5 flex items-start gap-x-3 p-4 rounded-xl bg-red-50 border border-red-200 dark:bg-red-950/30 dark:border-red-800/50">
            <svg class="size-4.5 text-red-500 mt-0.5 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" x2="12" y1="8" y2="12" />
                <line x1="12" x2="12.01" y1="16" y2="16" />
            </svg>
            <div class="text-sm font-medium text-red-700 dark:text-red-400">Vui lòng kiểm tra lại thông tin đăng
                ký.</div>
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'register' %}" class="space-y-4" id="register-form">
            {% csrf_token %}

            <!-- Full name -->
            <div class="space-y-1.5">
                <label for="full_name" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Họ và
                    tên <span class="text-red-500">*</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none text-gray-400">
                        <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </div>
                    <input type="text" id="full_name" name="full_name" required autocomplete="name"
                        class="py-3 px-4 ps-11 w-full border-[1.5px] border-gray-200 rounded-xl text-sm bg-white hover:border-blue-400 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200 dark:placeholder-slate-500"
                        placeholder="Nguyễn Văn A...">
                </div>
            </div>

            <!-- Email -->
            <div class="space-y-1.5">
                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Email
                    công việc <span class="text-red-500">*</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none text-gray-400">
                        <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2" />
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                        </svg>
                    </div>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="py-3 px-4 ps-11 w-full border-[1.5px] border-gray-200 rounded-xl text-sm bg-white hover:border-blue-400 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200 dark:placeholder-slate-500"
                        placeholder="email@dinhanh.vn...">
                </div>
            </div>

            <!-- Username -->
            <div class="space-y-1.5">
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Tên
                    đăng nhập <span class="text-red-500">*</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none text-gray-400">
                        <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                            <path d="M2 12h20" />
                        </svg>
                    </div>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        class="py-3 px-4 ps-11 w-full border-[1.5px] border-gray-200 rounded-xl text-sm bg-white hover:border-blue-400 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200 dark:placeholder-slate-500"
                        placeholder="dinhanh_admin...">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"> Vai trò <span
                        class="text-red-500">*</span></label>
                <div class="relative">
                    <select
                        class="py-3 px-4 w-full border-[1.5px] border-gray-200 rounded-xl text-sm bg-white hover:border-blue-400 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200 dark:placeholder-slate-500 cursor-pointer appearance-none">
                        <option value="" disabled selected>Chọn vai trò...</option>
                        <option value="dispatcher">Nhân viên điều vận</option>
                        <option value="cashier">Nhân viên bán vé</option>
                        <option value="manager">Quản lý</option>
                        <option value="accountant">Kế toán</option>
                        <option value="driver">Tài xế</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Password + Confirm -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Mật khẩu
                        <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none text-gray-400">
                            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" required autocomplete="new-password"
                            class="py-3 px-4 ps-11 pe-11 w-full border-[1.5px] border-gray-200 rounded-xl text-sm bg-white hover:border-blue-400 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200 dark:placeholder-slate-500"
                            placeholder="••••••••">
                    </div>
                    <div class="flex gap-x-1 mt-1.5" id="strength-bars">
                        <div class="h-1 flex-1 rounded-full bg-gray-200 transition-colors" id="bar-1"></div>
                        <div class="h-1 flex-1 rounded-full bg-gray-200 transition-colors" id="bar-2"></div>
                        <div class="h-1 flex-1 rounded-full bg-gray-200 transition-colors" id="bar-3"></div>
                        <div class="h-1 flex-1 rounded-full bg-gray-200 transition-colors" id="bar-4"></div>
                    </div>
                    <p class="text-xs text-gray-400" id="strength-label">Tối thiểu 8 ký tự</p>
                </div>

                <div class="space-y-1.5">
                    <label for="confirm_password"
                        class="block text-sm font-medium text-gray-700 dark:text-slate-300">Xác nhận mật khẩu
                        <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 inset-s-0 flex items-center ps-4 pointer-events-none text-gray-400">
                            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                            </svg>
                        </div>
                        <input type="password" id="confirm_password" name="confirm_password" required
                            autocomplete="new-password"
                            class="py-3 px-4 ps-11 pe-11 w-full border-[1.5px] border-gray-200 rounded-xl text-sm bg-white hover:border-blue-400 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200 dark:placeholder-slate-500"
                            placeholder="••••••••">
                        <span class="absolute inset-y-0 inset-e-0 flex items-center pe-4" id="match-icon"></span>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-xl bg-blue-600 text-white shadow-md shadow-blue-500/20 hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-500/30 active:scale-[0.98] focus:outline-none transition-all mt-2">
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <line x1="19" x2="19" y1="8" y2="14" />
                    <line x1="22" x2="16" y1="11" y2="11" />
                </svg>
                Tạo tài khoản
            </button>
        </form>

        <p class="mt-5 text-center text-sm text-gray-500 dark:text-slate-400">
            Đã có tài khoản?
            <a href="{% url 'login' %}"
                class="font-semibold text-blue-600 hover:text-blue-700 dark:text-blue-400 hover:underline ms-1">
                Đăng nhập ngay
            </a>
        </p>

        <div class="mt-6 flex items-center justify-center gap-x-2 text-xs text-gray-400 dark:text-slate-600">
            <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            Thông tin được mã hóa và bảo mật SSL
        </div>
    </div>
</div>
