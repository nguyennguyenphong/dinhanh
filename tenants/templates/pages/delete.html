{% load static %}

<div x-data="{ 
    actionUrl: '', 
    actionTitle: '',
    confirmAction(url, title) { 
        this.actionUrl = url; 
        this.actionTitle = title;
    } 
}">

    <div id="{{ tenant.uuid }}" tabindex="-1" aria-hidden="true"
        class="ui-overlay hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-2xl max-h-full">
            <div class="relative bg-neutral-primary-soft border border-default rounded-md shadow-sm p-4 md:p-6">
                <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
                    <h3 class="text-lg font-medium text-heading">Xác nhận xóa tenant</h3>
                    <button type="button" class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-md text-sm w-9 h-9 ms-auto inline-flex justify-center items-center" data-modal-hide="{{ tenant.uuid }}">
                        <img src="{% static 'icons/close.svg' %}" alt="close" class="size-4.5">
                    </button>
                </div>

                <div class="space-y-4 md:space-y-6 py-4 md:py-6">
                    <p class="leading-relaxed text-body font-medium">Vui lòng chọn phương thức xóa cho tenant: <strong>{{ tenant.name }}</strong></p>

                    <div class="space-y-3">
                        <div class="border border-gray-200 rounded-md p-4">
                            <p class="text-sm font-semibold text-heading">Xóa tạm thời (Soft Delete)</p>
                            <p class="text-xs text-body mb-4">Dữ liệu vẫn được giữ nhưng sẽ bị ẩn đi.</p>
                            <button type="button" 
                                    @click="confirmAction('{% url 'tenant_soft_delete' tenant.uuid %}', 'Xóa tạm thời')"
                                    data-modal-target="confirm-modal-{{ tenant.uuid }}" data-modal-toggle="confirm-modal-{{ tenant.uuid }}"
                                    class="text-white bg-brand hover:bg-brand-strong font-medium rounded-md text-sm px-4 py-2.5">
                                Xác nhận Xóa Tạm thời
                            </button>
                        </div>

                        <div class="border border-gray-200 rounded-md p-4">
                            <p class="text-sm font-semibold text-danger">Xóa vĩnh viễn (Hard Delete)</p>
                            <p class="text-xs text-body mb-4">Dữ liệu sẽ bị xóa hoàn toàn khỏi hệ thống.</p>
                            <button type="button" 
                                    @click="confirmAction('{% url 'tenant_hard_delete' tenant.uuid %}', 'Xóa vĩnh viễn')"
                                    data-modal-target="confirm-modal-{{ tenant.uuid }}" data-modal-toggle="confirm-modal-{{ tenant.uuid }}"
                                    class="text-white bg-danger hover:bg-danger-strong font-medium rounded-md text-sm px-4 py-2.5">
                                Xác nhận Xóa Vĩnh viễn
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="confirm-modal-{{ tenant.uuid }}" aria-hidden="true"
        class="ui-overlay hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-60 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
            <div class="relative bg-neutral-primary-soft border border-default rounded-md shadow-sm p-4 md:p-6">
                <div class="p-4 md:p-5 text-center">
                    <h3 class="mb-6 text-lg font-medium text-heading" x-text="'Bạn có chắc chắn muốn ' + actionTitle + ' tenant {{ tenant.name }}?'"></h3>
                    
                    <div class="flex items-center space-x-4 justify-center">
                        <form :action="actionUrl" method="post">
                            {% csrf_token %}
                            <button type="submit" class="text-white bg-danger hover:bg-danger-strong font-medium rounded-md text-sm px-5 py-2.5">
                                Chắc chắn, xóa ngay
                            </button>
                        </form>
                        
                        <button data-modal-hide="confirm-modal-{{ tenant.uuid }}" type="button" class="text-body bg-neutral-secondary-medium border border-gray-200 hover:bg-neutral-tertiary-medium font-medium rounded-md text-sm px-5 py-2.5">
                            Hủy
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
