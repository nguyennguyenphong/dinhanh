<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-4">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Bản địa hoá
    </h3>
    <div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <div>
                    <label for="default_language" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
                        Ngôn ngữ mặc định <span class="text-red-500">*</span>
                    </label>

                    <select
                        name="default_language"
                        id="default_language"
                        required
                        class="w-full py-3 mt-1 border-[1.5px] border-gray-200 rounded-md text-sm hover:border-blue-500 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200"
                    >
                        <option value="">Chọn ngôn ngữ hiển thị</option>
                        <option value="vi" selected>Tiếng Việt</option>
                        <option value="en">Tiếng Anh</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label for="timezone" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
                        Múi giờ <span class="text-red-500">*</span>
                    </label>

                    <select
                        name="timezone"
                        id="timezone"
                        required
                        class="w-full py-3 mt-1 border-[1.5px] border-gray-200 rounded-md text-sm hover:border-blue-500 focus:border-blue-500 focus:ring-0 focus:border-[1.5px] transition-all dark:bg-slate-800 dark:border-slate-700 dark:text-gray-200"
                    >
                        <option value="">Chọn múi giờ</option>
                        <option value="Asia/Ho_Chi_Minh" selected>Asia/Ho_Chi_Minh (GMT+7)</option>
                        <option value="Asia/Vientiane">Asia/Vientiane (GMT+7)</option>
                        <option value="Asia/Phnom_Penh">Asia/Phnom_Penh (GMT+7)</option>
                        <option value="Asia/Bangkok">Asia/Bangkok (GMT+7)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>
