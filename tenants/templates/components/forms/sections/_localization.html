<div class="space-y-4 p-4 rounded-md bg-white border border-gray-200 mb-4">
    <h3
        class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-slate-800 pb-1">
        Bản địa hoá
    </h3>
    <div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label for="{{ form.default_language.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
                    {{ form.default_language.label }} <span class="text-red-500">*</span>
                </label>
                <div>
                    {{ form.default_language }}
                </div>
                {% if form.default_language.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ form.default_language.errors.0 }}</p>
                {% endif %}
            </div>
            <div class="space-y-1">
                <label for="{{ form.timezone.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-slate-300">
                    {{ form.timezone.label }} <span class="text-red-500">*</span>
                </label>
                <div>
                    {{ form.timezone }}
                </div>
                {% if form.timezone.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ form.timezone.errors.0 }}</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
