<div class="flex justify-end gap-3 mt-4 dark:border-slate-800 pt-4">
    <a href="{% url 'tenant_list' %}"
        class="px-4 py-2 border border-gray-300 dark:border-slate-700 rounded-md text-sm font-medium text-gray-700 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors">
        Hủy bỏ
    </a>
    <button type="submit"
        class="inline-flex items-center justify-center gap-x-2 font-semibold rounded-md transition-all duration-200 focus:outline-none active:scale-[0.98] py-2.5 px-4 text-sm  bg-blue-600 text-white hover:bg-blue-700 shadow-md shadow-blue-500/20">
        {% if object %} Lưu thay đổi {% else %} Khởi tạo ngay {% endif %}
    </button>
</div>
