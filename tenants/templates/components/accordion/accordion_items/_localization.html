<h2 id="accordion-open-heading-4">
    <button type="button"
        class="flex items-center justify-between w-full p-5 font-medium rtl:text-right text-body hover:text-heading hover:bg-neutral-secondary-medium gap-3"
        data-accordion-target="#accordion-open-body-4" aria-expanded="true" aria-controls="accordion-open-body-4">
        <span class="flex items-center"> Bản địa hóa</span>
        <svg data-accordion-icon class="w-5 h-5 rotate-180 shrink-0" aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m5 15 7-7 7 7" />
        </svg>
    </button>
</h2>
<div id="accordion-open-body-4" class="hidden" aria-labelledby="accordion-open-heading-4">
    <div class="p-4 md:p-5 border border-t-default border-b-0 border-x-0">
        <div class="flex items-center py-2.5 text-sm">
            <span class="w-36 text-gray-500 shrink-0">Ngôn ngữ hiển thị</span>
            <span class="font-medium text-gray-900 dark:text-white">{{ tenant.default_language }}</span>
        </div>
        <div class="flex items-center py-2.5 text-sm">
            <span class="w-36 text-gray-500 shrink-0">Timezone</span>
            <span class="font-medium text-gray-900 dark:text-white">{{ tenant.timezone }}</span>
        </div>
    </div>
</div>
