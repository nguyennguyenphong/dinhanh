# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: dinhanh-secret
  namespace: dinhanh
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-change-in-production"
  DB_NAME: "dinhanh_db"
  DB_USER: "dinhanh_user"
  DB_PASSWORD: "secure-db-password-change-me"
  EMAIL_HOST_PASSWORD: "your-email-password"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
